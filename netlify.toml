# Netlify: the whole repo is the site. The page lives in index.html,
# so "/" is served from it. Every other unknown path also goes there.
[build]
  publish = "."
  # an upload that changes only tests, notes or database scripts makes no deploy (each costs credits): see the script
  ignore = "bash ./tools/netlify-skip-build.sh"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Serverless functions (Stripe escrow) must not be caught by the page redirect below.
[[redirects]]
  from = "/.netlify/functions/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
