# Netlify: the whole repo is the site. The page lives in index.html,
# so "/" is served from it. Every other unknown path also goes there.
[build]
  publish = "."
  # every upload is built, also one that changes only tests or notes: see the script (why: the check of 19 November)
  ignore = "bash ./tools/netlify-skip-build.sh"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# The payment functions answer at /.netlify/functions/…, and the page rules below do not catch them (check of 14 December:
# on cuvori.io stripe-status answered, and Admin panel → Payment costs said "Protected payments: ON"). No rule can be
# written to keep them from those rules: Netlify refuses a redirect rule for a /.netlify address on every build ("path"
# field must not start with "/.netlify") and ignores it, so the one that stood here from 17 September protected nothing.

[[redirects]]
  from = "/"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
